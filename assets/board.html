<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hackathon Board</title>
<!--
  HACKATHON BOARD - the builder's home base for the Agentic Society Hackathon.

  One file. No server, no install. Open it in a browser (double-click). The
  builder's AI keeps it current by editing ONLY the JSON inside
  <script id="hackathon-data"> below; the page renders everything from that.
  Turn on "Auto-refresh" (top right) and the page reloads itself every 20
  seconds, so the board moves while the AI works.

  Three views: Board (tickets by column), Sessions (the four build sessions
  with goal, checkpoint and close-out), Report (what shipped, what it would
  have cost a human, what remains). Print the Report view to get a PDF.

  Rules for the AI are in SKILL.md ("Build mode" and "The board"). The
  schema is documented in the sample data below. Keep every key.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --bg: #04060e;
    --bg-2: #0a0c1e;
    --surface: rgba(255,255,255,0.05);
    --surface-2: rgba(255,255,255,0.08);
    --line: rgba(255,255,255,0.10);
    --line-2: rgba(255,255,255,0.18);
    --ink: #eaf0ff;
    --ink-soft: #a3acbd;
    --ink-mute: #6b7489;
    --blue: #2f6bff;
    --blue-glow: rgba(47,107,255,0.22);
    --violet: #6d5cf5;
    --green: #22c55e;
    --paper: #f3f1ec;
    --font-sans: "Geist", -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "Roboto Mono", Menlo, Consolas, monospace;
    --r: 14px;
    --r-sm: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(60rem 30rem at 50% -10%, var(--blue-glow), transparent 60%), var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  .mono { font-family: var(--font-mono); }
  .wrap { max-width: 88rem; margin: 0 auto; padding: 20px clamp(14px, 3vw, 32px) 60px; }

  /* ── Header ───────────────────────────────────────────────────────────── */
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { height: 26px; width: auto; color: #fff; }
  .brand .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-mute); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .tabs button { border: 0; background: transparent; color: var(--ink-soft); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .tabs button[aria-selected="true"] { background: rgba(47,107,255,0.22); color: #fff; box-shadow: inset 0 0 0 1px rgba(47,107,255,0.55); }
  .tabs button:focus-visible, .pill:focus-visible, .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft); font-size: 13px; cursor: pointer; }
  .pill[aria-pressed="true"] { color: #fff; border-color: rgba(47,107,255,0.55); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-mute); }
  .pill[aria-pressed="true"] .dot { background: var(--blue); box-shadow: 0 0 0 4px var(--blue-glow); animation: pulse 2.4s ease infinite; }

  /* Pomodoro timer */
  .pomo { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .pomo__modes { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); }
  .pomo__modes button { border: 0; background: transparent; color: var(--ink-mute); font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius: 999px; cursor: pointer; }
  .pomo__modes button[aria-pressed="true"] { background: rgba(47,107,255,0.25); color: #fff; }
  .pomo__time { font-size: 20px; font-weight: 500; letter-spacing: 0.02em; min-width: 4.2ch; text-align: center; color: var(--ink); font-variant-numeric: tabular-nums; padding: 0 4px; }
  .pomo.running .pomo__time { color: #fff; text-shadow: 0 0 18px var(--blue-glow); }
  .pomo.done .pomo__time { color: #9be7b4; }
  .pomo.done { border-color: rgba(34,197,94,0.6); box-shadow: 0 0 24px rgba(34,197,94,0.25); animation: pomo-done 1.2s ease infinite alternate; }
  @keyframes pomo-done { from { box-shadow: 0 0 10px rgba(34,197,94,0.15); } to { box-shadow: 0 0 28px rgba(34,197,94,0.45); } }
  .pomo__btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--ink); cursor: pointer; font-size: 12px; display: grid; place-items: center; }
  .pomo__btn:hover { background: var(--surface-2); }
  .pomo__btn:focus-visible, .pomo__modes button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  #pomoGo { background: rgba(47,107,255,0.25); border-color: rgba(47,107,255,0.6); color: #fff; }
  @media (prefers-reduced-motion: reduce) { .pomo.done { animation: none; } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--blue-glow); } 60% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  .hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; padding: 22px 0 18px; align-items: start; }
  .who { font-family: var(--font-mono); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 8px; }
  .one { margin: 0; font-size: clamp(1.35rem, 2.6vw, 2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
  .one .holo { background: linear-gradient(115deg, #b8c6ff, #e9b9ff 40%, #b0f3e0 75%, #c9d4ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft); }
  .chip b { color: var(--ink); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
  .stat .k { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-mute); }
  .stat .v { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 0.8rem; color: var(--ink-soft); font-weight: 500; margin-left: 4px; }
  .stat.now { border-color: rgba(47,107,255,0.55); box-shadow: 0 0 32px var(--blue-glow); }
  .stat .sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .sample { margin: 0 0 14px; padding: 10px 14px; border-radius: var(--r-sm); background: rgba(109,92,245,0.14); border: 1px solid rgba(109,92,245,0.45); font-size: 13px; }

  /* ── Views ─────────────────────────────────────────────────────────────── */
  .view[hidden] { display: none !important; }

  /* Board columns */
  .cols { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; min-height: 240px; display: flex; flex-direction: column; gap: 8px; }
  .col h2 { margin: 2px 4px 6px; font-size: 12px; font-family: var(--font-mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-soft); display: flex; justify-content: space-between; }
  .col h2 .n { color: var(--ink-mute); }
  .col.shipped h2 { color: #9be7b4; }
  .col.doing { border-color: rgba(47,107,255,0.5); }
  .card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; display: grid; gap: 6px; }
  .card .t { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .card .d { font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }
  .card .m { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute); }
  .tier { padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line-2); letter-spacing: 0.6px; text-transform: uppercase; }
  .tier.must { color: #fff; background: rgba(47,107,255,0.28); border-color: rgba(47,107,255,0.6); }
  .tier.should { color: #d9d4ff; background: rgba(109,92,245,0.22); border-color: rgba(109,92,245,0.55); }
  .tier.stretch { color: var(--ink-soft); }
  .tier.prep { color: #cfd6e6; background: var(--surface-2); }
  .risk { color: #ffd98a; }
  .x { color: #9be7b4; font-weight: 500; }
  .card.shipped .t { color: #cfe8d6; }
  .card.cut { opacity: 0.55; }
  .card.cut .t { text-decoration: line-through; }
  .empty { font-size: 12.5px; color: var(--ink-mute); padding: 8px 6px; }

  /* Sessions */
  .sess { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .s { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; }
  .s.active { border-color: rgba(47,107,255,0.6); box-shadow: 0 0 36px var(--blue-glow); }
  .s.done { border-color: rgba(34,197,94,0.35); }
  .s .when { font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-mute); display: flex; justify-content: space-between; }
  .s h3 { margin: 0; font-size: 15px; }
  .s .goal { font-size: 13.5px; color: var(--ink-soft); }
  .s .cp { font-size: 13px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--bg-2); border: 1px solid var(--line); }
  .s .cp b { display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 3px; font-weight: 500; }
  .s .close { font-size: 12.5px; color: var(--ink-soft); }
  .s .badge { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); }
  .s.active .badge { color: #fff; border-color: var(--blue); background: rgba(47,107,255,0.25); }
  .s.done .badge { color: #9be7b4; border-color: rgba(34,197,94,0.5); }
  .s .nums { display: flex; gap: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); }
  .s ul { margin: 0; padding-left: 16px; font-size: 13px; color: var(--ink-soft); }
  .cut { margin-top: 14px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px dashed var(--line-2); font-size: 13.5px; }
  .cut b { color: #ffd98a; }
  .log { margin-top: 18px; }
  .log h2, .rep h2 { font-family: var(--font-mono); font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; }
  .log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .log li { display: grid; grid-template-columns: 88px 1fr; gap: 10px; font-size: 13.5px; }
  .log li .at { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-mute); padding-top: 2px; }

  /* Report */
  .rep { display: grid; gap: 18px; }
  .big { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .big .stat .v { font-size: 2rem; }
  .two { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
  .panel p { margin: 0 0 10px; color: var(--ink); }
  .panel p:last-child { margin-bottom: 0; }
  .panel ul, .panel ol { margin: 0; padding-left: 18px; }
  .panel li { margin-bottom: 6px; font-size: 14px; }
  .panel li .mono { color: var(--ink-mute); font-size: 11.5px; }
  .bar { height: 10px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); overflow: hidden; margin: 8px 0 6px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--violet)); }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; font-size: 14px; }
  .kv .mono { color: var(--ink-soft); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .done-list li.ok { color: #cfe8d6; }
  .done-list li.ok::marker { content: "✓ "; color: var(--green); }
  .done-list li.no::marker { content: "○ "; color: var(--ink-mute); }
  .done-list { list-style: none; padding-left: 4px; }
  .btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn:hover { background: var(--surface-2); }
  .foot { margin-top: 30px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 1px; color: var(--ink-mute); text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 8px 20px; }

  @media (max-width: 900px) {
    .hero, .two { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .sess { grid-template-columns: 1fr 1fr; }
    .big { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .sess, .big { grid-template-columns: 1fr; }
    .cols { grid-template-columns: repeat(5, 82vw); }
  }
  @media print {
    body { background: #fff; color: #111; }
    :root { --surface: #fff; --surface-2: #f3f3f3; --line: #ddd; --line-2: #bbb; --ink: #111; --ink-soft: #444; --ink-mute: #777; --bg-2: #fafafa; }
    .controls, .sample, .foot .noprint { display: none !important; }
    .brand svg { color: #000; }
    .one .holo { -webkit-text-fill-color: #111; background: none; }
    .stat.now { box-shadow: none; }
    .wrap { padding: 0; max-width: none; }
  }
</style>
</head>

    { "id": "T-07", "title": "Handle quotes with no email address", "detail": "Found mid-build: 6 rows have a phone number only. Draft a text instead, flag for Maria.", "tier": "should", "status": "session", "session": 3, "humanHours": 1.5, "aiMinutes": 0, "risk": false, "discovered": "S3", "cutReason": "" },
    { "id": "T-08", "title": "Morning run on its own at 7am", "detail": "Scheduled task so Maria opens Gmail to ready drafts.", "tier": "should", "status": "backlog", "session": 3, "humanHours": 3, "aiMinutes": 0, "risk": false, "discovered": "", "cutReason": "" },
    { "id": "T-09", "title": "Property lookup: pull the address and job type into the draft", "detail": "Reads the estimate PDF link in the sheet.", "tier": "stretch", "status": "backlog", "session": 4, "humanHours": 4, "aiMinutes": 0, "risk": false, "discovered": "", "cutReason": "" },
    { "id": "T-10", "title": "Weekly summary to Maria: how many followed up, how many replied", "detail": "", "tier": "stretch", "status": "cut", "session": 4, "humanHours": 3, "aiMinutes": 0, "risk": false, "discovered": "", "cutReason": "Not needed for the demo; after the event." },
    { "id": "T-11", "title": "Export quotes from the CRM to the sheet", "detail": "Prep-week item, done Monday night.", "tier": "prep", "status": "shipped", "session": 1, "humanHours": 1, "aiMinutes": 15, "risk": false, "discovered": "", "cutReason": "" }
  ],
  "log": [
    { "at": "Thu 12:10", "what": "Sheet shared; Claude listed the 5 newest quotes. Riskiest unknown settled." },
    { "at": "Thu 12:55", "what": "First Gmail draft created from Claude." },
    { "at": "Thu 3:20", "what": "First real follow-up drafted for the Hernandez quote ($4,200). End to end works." },
    { "at": "Thu 4:00", "what": "Session 2 closed: checkpoint hit. Room target (50% done) met." },
    { "at": "Fri 9:40", "what": "Discovered 6 quotes with no email. New ticket T-07." }
  ],
  "report": {
    "summary": [],
    "nextSteps": [],
    "manualHoursNote": ""
  }
}

<script>
(function () {
  const raw = document.getElementById("hackathon-data").textContent;
  let D;
  try { D = JSON.parse(raw); } catch (e) {
    document.querySelector(".wrap").insertAdjacentHTML("afterbegin", '<p class="sample">The data block is not valid JSON: ' + String(e.message) + '. Ask your AI to fix the JSON inside &lt;script id="hackathon-data"&gt;.</p>');
    return;
  }
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const h1 = (n) => (Math.round(n * 10) / 10).toString();
  const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
  const mins = (m) => m >= 60 ? h1(m / 60) + " h" : Math.round(m) + " min";

  const T = D.tickets || [];
  const S = D.sessions || [];
  const shipped = T.filter((t) => t.status === "shipped");
  const open = T.filter((t) => t.status !== "shipped" && t.status !== "cut");
  const cut = T.filter((t) => t.status === "cut");
  const humanShipped = sum(shipped, (t) => t.humanHours);
  const humanOpen = sum(open, (t) => t.humanHours);
  const minutesUsed = sum(S.filter((s) => s.status === "done"), (s) => s.minutesUsed);
  const minutesLive = (() => { const a = S.find((s) => s.status === "active"); if (!a) return 0; const st = new Date(a.start), now = new Date(); const m = (now - st) / 60000; const cap = (new Date(a.end) - st) / 60000; return Math.max(0, Math.min(m, cap)); })();
  const buildMinutes = minutesUsed + minutesLive;
  const buildHours = buildMinutes / 60;
  const compression = buildHours > 0 ? humanShipped / buildHours : 0;
  const tokens = sum(S, (s) => s.tokens);
  const plannedMinutes = sum(S, (s) => (new Date(s.end) - new Date(s.start)) / 60000);

  // ── Sample banner + header ─────────────────────────────────────────────
  $("#sample").hidden = !D.sample;
  const b = D.builder || {}, p = D.project || {};
  $("#who").textContent = [b.name, b.business].filter(Boolean).join(" · ") + (b.level ? " · Level " + b.level : "");
  $("#one").innerHTML = esc(p.oneLiner || "Run /hackathon-plan to fill this in.").replace(/^I'm building (.+?) that/, 'I\'m building <span class="holo">$1</span> that');
  $("#chips").innerHTML = [
    p.category ? '<span class="chip"><b>' + esc(p.category) + "</b></span>" : "",
    p.doneWall ? '<span class="chip">Done Wall: <b>' + esc(p.doneWall) + "</b></span>" : "",
    (b.tools || []).length ? '<span class="chip">' + esc(b.tools.join(" · ")) + "</span>" : "",
  ].join("");

  // ── Stats strip ────────────────────────────────────────────────────────
  // The clock card reads the run of show (event.agenda): what block is on
  // now, how long it has left, and how much build time the event still
  // holds. Falls back to the sessions when there is no agenda.
  const A = ((D.event || {}).agenda || []).map((x) => ({ ...x, s: new Date(x.start), e: new Date(x.end) })).sort((a, b2) => a.s - b2.s);
  const NOW = new Date();
  const fmtDur = (m) => (m >= 120 ? h1(m / 60) + "<small>h</small>" : Math.max(0, Math.round(m)) + "<small>min</small>");
  const fmtWhen = (d) => d.toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
  const buildLeft = A.filter((x) => x.kind === "build" && x.e > NOW).reduce((acc, x) => acc + (x.e - Math.max(x.s, NOW)) / 60000, 0);
  const current = A.find((x) => x.s <= NOW && NOW < x.e);
  const next = A.find((x) => x.s > NOW);
  const nextBuild = A.find((x) => x.kind === "build" && x.s > NOW);
  const active = S.find((s) => s.status === "active");
  const nextUp = S.find((s) => s.status === "planned");
  let nowCard;
  if (A.length) {
    if (current) {
      const left = (current.e - NOW) / 60000;
      const isBuild = current.kind === "build";
      nowCard = { k: (isBuild ? "Session " + current.session + " · live" : current.kind === "deadline" ? "Deadline" : "Now"), v: fmtDur(left) + "<small style='margin-left:6px'>left</small>", sub: current.label + (isBuild ? "" : nextBuild ? " · S" + nextBuild.session + " at " + nextBuild.s.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : ""), now: true };
    } else if (next) {
      const until = (next.s - NOW) / 60000;
      nowCard = { k: until > 24 * 60 ? "Hackathon" : "Up next", v: until > 24 * 60 ? Math.ceil(until / 1440) + "<small>days to go</small>" : fmtDur(until) + "<small style='margin-left:6px'>to go</small>", sub: next.label + " · " + fmtWhen(next.s), now: until <= 24 * 60 };
    } else {
      nowCard = { k: "Hackathon", v: "Done", sub: "Open the Report", now: false };
    }
  } else if (active) {
    const left = Math.max(0, Math.round((new Date(active.end) - NOW) / 60000));
    nowCard = { k: "Session " + active.n + " · live", v: left + "<small>min left</small>", sub: active.label, now: true };
  } else if (nextUp) {
    nowCard = { k: "Next session", v: "S" + nextUp.n, sub: nextUp.label, now: false };
  } else {
    nowCard = { k: "Hackathon", v: "Done", sub: "See the report", now: false };
  }
  const submitBy = (D.event || {}).submitBy ? new Date(D.event.submitBy) : null;
  const buildLeftCard = submitBy && NOW < submitBy
    ? { k: "Build time left", v: fmtDur(buildLeft), sub: "across the sessions still ahead · submit by " + submitBy.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) }
    : null;
  const stats = [
    nowCard,
    buildLeftCard || { k: "Shipped", v: shipped.length + "<small>of " + (T.length - cut.length) + "</small>", sub: cut.length ? cut.length + " cut" : "no cuts" },
    ...(buildLeftCard ? [{ k: "Shipped", v: shipped.length + "<small>of " + (T.length - cut.length) + "</small>", sub: cut.length ? cut.length + " cut" : "no cuts" }] : []),
    { k: "Human-hours shipped", v: h1(humanShipped) + "<small>h</small>", sub: "in " + mins(buildMinutes) + " of build time" },
    { k: "Compression", v: (compression ? h1(compression) : "–") + "<small>×</small>", sub: "human time ÷ your time" },
    { k: "Definition of done", v: (p.done || []).filter((d) => d.ok).length + "<small>of " + (p.done || []).length + "</small>", sub: "checks passing" },
    ...(buildLeftCard ? [] : [{ k: "Tokens", v: tokens ? (tokens >= 1e6 ? h1(tokens / 1e6) + "<small>M</small>" : Math.round(tokens / 1000) + "<small>k</small>") : "–", sub: "logged at session close" }]),
  ];
  $("#stats").innerHTML = stats.map((s) => '<div class="stat' + (s.now ? " now" : "") + '"><div class="k">' + esc(s.k) + '</div><div class="v">' + s.v + '</div><div class="sub">' + esc(s.sub) + "</div></div>").join("");

  // ── Board ──────────────────────────────────────────────────────────────
  const cols = [
    { key: "backlog", label: "Backlog" },
    { key: "session", label: "This session" },
    { key: "doing", label: "In progress", cls: "doing" },
    { key: "shipped", label: "Shipped", cls: "shipped" },
    { key: "cut", label: "Cut" },
  ];
  const order = { must: 0, should: 1, stretch: 2, prep: 3 };
  const card = (t) => '<article class="card ' + esc(t.status) + '"><div class="t">' + esc(t.title) + "</div>" +
    (t.detail ? '<div class="d">' + esc(t.detail) + "</div>" : "") +
    '<div class="m"><span>' + esc(t.id) + '</span><span class="tier ' + esc(t.tier) + '">' + esc(t.tier) + "</span>" +
    (t.session ? "<span>S" + esc(t.session) + "</span>" : "") +
    (t.humanHours ? "<span>" + h1(t.humanHours) + "h human</span>" : "") +
    (t.status === "shipped" && t.aiMinutes ? "<span>" + Math.round(t.aiMinutes) + " min with AI</span>" + (t.humanHours ? '<span class="x">' + h1((t.humanHours * 60) / t.aiMinutes) + "×</span>" : "") : "") +
    (t.risk ? '<span class="risk">riskiest unknown</span>' : "") +
    (t.discovered ? "<span>found " + esc(t.discovered) + "</span>" : "") +
    (t.status === "cut" && t.cutReason ? "<span>" + esc(t.cutReason) + "</span>" : "") +
    "</div></article>";
  $("#cols").innerHTML = cols.map((c) => {
    const items = T.filter((t) => t.status === c.key).sort((a, b2) => (order[a.tier] ?? 9) - (order[b2.tier] ?? 9) || String(a.id).localeCompare(String(b2.id)));
    return '<div class="col ' + (c.cls || "") + '"><h2>' + esc(c.label) + '<span class="n">' + items.length + "</span></h2>" +
      (items.length ? items.map(card).join("") : '<div class="empty">Nothing here yet.</div>') + "</div>";
  }).join("");

  // ── Sessions ───────────────────────────────────────────────────────────
  $("#sess").innerHTML = S.map((s) => {
    const mine = T.filter((t) => t.session === s.n && t.status !== "cut");
    const done = mine.filter((t) => t.status === "shipped").length;
    const badge = s.status === "active" ? "live now" : s.status === "done" ? (s.checkpointHit ? "checkpoint hit" : "checkpoint missed") : "planned";
    return '<div class="s ' + esc(s.status) + '"><div class="when"><span>Session ' + s.n + "</span><span>" + esc(s.label) + "</span></div>" +
      "<h3>" + esc(s.goal.split(":")[0]) + "</h3>" +
      '<div class="goal">' + esc(s.goal) + "</div>" +
      '<div class="cp"><b>Ends when</b>' + esc(s.checkpoint) + "</div>" +
      '<div class="nums"><span class="badge">' + badge + "</span><span>" + done + "/" + mine.length + " tickets</span>" +
      (s.minutesUsed ? "<span>" + s.minutesUsed + " min</span>" : "") + (s.tokens ? "<span>" + Math.round(s.tokens / 1000) + "k tok</span>" : "") + "</div>" +
      (mine.length ? "<ul>" + mine.map((t) => "<li>" + (t.status === "shipped" ? "✓ " : "") + esc(t.title) + "</li>").join("") + "</ul>" : "") +
      (s.closeNote ? '<div class="close">Next: ' + esc(s.closeNote) + "</div>" : "") + "</div>";
  }).join("");
  $("#cutline").innerHTML = "<b>Cut line.</b> " + esc(D.cutLine || "Decide it in Session 1: what gets cut if the Friday 11:30 checkpoint is missed.");
  $("#log").innerHTML = "<h2>Ship log</h2>" + ((D.log || []).length ? "<ol>" + D.log.map((l) => '<li><span class="at">' + esc(l.at) + "</span><span>" + esc(l.what) + "</span></li>").join("") + "</ol>" : '<div class="empty">Your AI adds a line here each time something ships.</div>');

  // ── Report ─────────────────────────────────────────────────────────────
  const R = D.report || {};
  const remainingAiHours = compression ? humanOpen / compression : humanOpen;
  $("#big").innerHTML = [
    { k: "Tickets shipped", v: shipped.length + "<small>of " + (T.length - cut.length) + " planned</small>" },
    { k: "Work shipped, in human-hours", v: h1(humanShipped) + "<small>h</small>" },
    { k: "Your build time", v: h1(buildHours) + "<small>h of " + h1(plannedMinutes / 60) + " available</small>" },
    { k: "Time compression", v: (compression ? h1(compression) : "–") + "<small>× faster than by hand</small>" },
  ].map((s) => '<div class="stat"><div class="k">' + esc(s.k) + '</div><div class="v">' + s.v + "</div></div>").join("");

  const pct = T.length ? Math.round((shipped.length / Math.max(1, T.length - cut.length)) * 100) : 0;
  $("#story").innerHTML = "<h2>What happened</h2>" +
    ((R.summary || []).length ? R.summary.map((x) => "<p>" + esc(x) + "</p>").join("") :
      "<p>" + esc(b.name || "The builder") + " shipped <b>" + shipped.length + "</b> of " + (T.length - cut.length) + " tickets (" + pct + "%), work a capable person would need about <b>" + h1(humanShipped) + " hours</b> to do by hand, in <b>" + h1(buildHours) + " hours</b> of build time across " + S.filter((s) => s.status !== "planned").length + " sessions" + (tokens ? ", using about " + (tokens >= 1e6 ? h1(tokens / 1e6) + "M" : Math.round(tokens / 1000) + "k") + " tokens" : "") + "." + (cut.length ? " " + cut.length + " ticket" + (cut.length > 1 ? "s were" : " was") + " cut on purpose to protect the demo." : "") + "</p>" +
      '<p class="mono" style="color:var(--ink-mute);font-size:12px">Your AI writes the real story here at the end of Session 4.</p>') +
    '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="kv"><span>Shipped</span><span class="mono">' + pct + "%</span></div>";

  $("#donelist").innerHTML = "<h2>Definition of done</h2>" + ((p.done || []).length ? '<ul class="done-list">' + p.done.map((d) => '<li class="' + (d.ok ? "ok" : "no") + '">' + esc(d.text) + "</li>").join("") + "</ul>" : '<div class="empty">No checks yet.</div>') +
    (p.demoMoment ? '<p style="margin-top:12px;font-size:13.5px;color:var(--ink-soft)"><b style="color:var(--ink)">Demo moment:</b> ' + esc(p.demoMoment) + "</p>" : "");

  $("#shipped").innerHTML = "<h2>Shipped</h2>" + (shipped.length ? "<ol>" + shipped.map((t) => "<li>" + esc(t.title) + ' <span class="mono">' + h1(t.humanHours) + "h human" + (t.aiMinutes ? " · " + Math.round(t.aiMinutes) + " min" : "") + "</span></li>").join("") + "</ol>" : '<div class="empty">Nothing shipped yet.</div>');

  $("#remaining").innerHTML = "<h2>What remains</h2>" + (open.length ?
    "<p>" + open.length + " open ticket" + (open.length > 1 ? "s" : "") + ", about <b>" + h1(humanOpen) + " human-hours</b>" + (compression ? ", or roughly <b>" + h1(remainingAiHours) + " hours</b> at the pace you kept this week" : "") + ".</p><ol>" +
    open.map((t) => "<li>" + esc(t.title) + ' <span class="mono">' + esc(t.tier) + " · " + h1(t.humanHours) + "h</span></li>").join("") + "</ol>" :
    "<p>Nothing left on the board. Everything planned either shipped or was cut on purpose.</p>") +
    ((R.nextSteps || []).length ? "<p style='margin-top:10px'><b>Next steps</b></p><ul>" + R.nextSteps.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "") +
    (cut.length ? "<p style='margin-top:10px;font-size:13px;color:var(--ink-soft)'>Cut on purpose: " + cut.map((t) => esc(t.title)).join("; ") + ".</p>" : "");

  $("#method").innerHTML = "<h2>How the numbers work</h2><p style='font-size:13.5px;color:var(--ink-soft)'>" +
    esc(R.manualHoursNote || "Every ticket gets an honest estimate, when it is created, of how long a capable person would need to do it without AI. That number never changes. Build time is the clock time of the sessions you used. Compression is shipped human-hours divided by your build time. Tokens are what your AI reported at each session close. These are planning numbers, not an audit.") + "</p>";

  // ── Report copy ────────────────────────────────────────────────────────
  $("#copyreport").addEventListener("click", async () => {
    const lines = [
      "HACKATHON REPORT · " + [b.name, b.business].filter(Boolean).join(", "),
      p.oneLiner || "",
      "",
      "Shipped " + shipped.length + " of " + (T.length - cut.length) + " tickets (" + pct + "%).",
      "Work shipped: ~" + h1(humanShipped) + " human-hours, in " + h1(buildHours) + " hours of build time (" + (compression ? h1(compression) + "x" : "n/a") + ").",
      tokens ? "Tokens: ~" + Math.round(tokens / 1000) + "k." : "",
      "",
      "SHIPPED", ...shipped.map((t) => "- " + t.title + " (" + h1(t.humanHours) + "h human)"),
      "", "REMAINING (~" + h1(humanOpen) + " human-hours)", ...open.map((t) => "- " + t.title + " (" + t.tier + ", " + h1(t.humanHours) + "h)"),
      cut.length ? "" : null, cut.length ? "CUT ON PURPOSE" : null, ...cut.map((t) => "- " + t.title + (t.cutReason ? ": " + t.cutReason : "")),
      "", "DEFINITION OF DONE", ...(p.done || []).map((d) => (d.ok ? "[x] " : "[ ] ") + d.text),
      (R.summary || []).length ? "" : null, ...(R.summary || []),
    ].filter((x) => x !== null);
    try { await navigator.clipboard.writeText(lines.join("\n")); const btn = $("#copyreport"); btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy report as text"), 1500); } catch (e) { alert(lines.join("\n")); }
  });

  // ── Tabs ───────────────────────────────────────────────────────────────
  const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
  const show = (v) => { tabs.forEach((t) => t.setAttribute("aria-selected", t.dataset.view === v ? "true" : "false")); document.querySelectorAll(".view").forEach((el) => (el.hidden = el.id !== "view-" + v)); try { localStorage.setItem("hb-view", v); } catch (e) {} };
  tabs.forEach((t) => t.addEventListener("click", () => show(t.dataset.view)));
  let v = "board"; try { v = localStorage.getItem("hb-view") || (location.hash === "#report" ? "report" : "board"); } catch (e) {}
  if (location.hash === "#report") v = "report";
  show(v);

  // ── Auto-refresh (reload every 20s; the AI rewrites this file) ─────────
  const auto = $("#auto");
  let on = false; try { on = localStorage.getItem("hb-auto") === "1"; } catch (e) {}
  const paint = () => auto.setAttribute("aria-pressed", on ? "true" : "false");
  paint();
  auto.addEventListener("click", () => { on = !on; try { localStorage.setItem("hb-auto", on ? "1" : "0"); } catch (e) {} paint(); if (on) setTimeout(() => location.reload(), 20000); });
  if (on) setTimeout(() => location.reload(), 20000);
  // ── Pomodoro ───────────────────────────────────────────────────────────
  // State lives in localStorage so the auto-refresh reload does not reset
  // it: { mode: minutes, endAt: ms epoch while running, left: ms while paused }.
  const pomo = $("#pomo"), pTime = $("#pomoTime"), pGo = $("#pomoGo"), pReset = $("#pomoReset");
  const modes = Array.from(pomo.querySelectorAll("[data-min]"));
  const load = () => { try { return JSON.parse(localStorage.getItem("hb-pomo") || "null") || {}; } catch (e) { return {}; } };
  const save = (st) => { try { localStorage.setItem("hb-pomo", JSON.stringify(st)); } catch (e) {} };
  let P = load();
  if (!P.mode) P = { mode: 25, left: 25 * 60000 };
  const baseTitle = document.title;
  const fmt = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
  const remaining = () => (P.endAt ? P.endAt - Date.now() : P.left);
  let chimed = false;
  const chime = () => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.18, 0.36].forEach((t, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = i === 2 ? 880 : 660; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.16); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.18); });
    } catch (e) {}
  };
  const paintPomo = () => {
    const r = remaining();
    pTime.textContent = fmt(r);
    const running = !!P.endAt && r > 0;
    const done = !!P.endAt && r <= 0;
    pomo.classList.toggle("running", running);
    pomo.classList.toggle("done", done);
    pGo.textContent = running ? "❚❚" : "▶";
    pGo.setAttribute("aria-label", running ? "Pause" : "Start");
    modes.forEach((b) => b.setAttribute("aria-pressed", Number(b.dataset.min) === P.mode ? "true" : "false"));
    document.title = running ? fmt(r) + " · " + baseTitle : done ? "Time · " + baseTitle : baseTitle;
    if (done && !chimed) { chimed = true; chime(); }
  };
  pGo.addEventListener("click", () => {
    const r = remaining();
    if (P.endAt && r > 0) { P = { mode: P.mode, left: r }; }            // pause
    else if (P.endAt && r <= 0) { const nextMode = P.mode === 25 ? 5 : 25; P = { mode: nextMode, endAt: Date.now() + nextMode * 60000 }; chimed = false; } // restart after done
    else { P = { mode: P.mode, endAt: Date.now() + (P.left || P.mode * 60000) }; }                             // start / resume
    save(P); paintPomo();
  });
  pReset.addEventListener("click", () => { P = { mode: P.mode, left: P.mode * 60000 }; chimed = false; save(P); paintPomo(); });
  modes.forEach((b) => b.addEventListener("click", () => { P = { mode: Number(b.dataset.min), left: Number(b.dataset.min) * 60000 }; chimed = false; save(P); paintPomo(); }));
  paintPomo();
  setInterval(paintPomo, 500);
  // Pomodoro is a per-viewer convenience; a blocked localStorage just means
  // the timer resets on reload, which the page already survives everywhere else.
})();
</script>
